name: InvoiceFlow CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-and-eval:
    name: Backend tests and eval thresholds
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend modules
        run: |
          python -m compileall api app tests

      - name: Run backend tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run eval threshold gate
        run: |
          python -m app.eval.check_eval_thresholds --output eval-results.json

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoiceflow-eval-results
          path: eval-results.json

  reviewer:
    name: Reviewer frontend tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reviewer/package-lock.json

      - name: Install reviewer dependencies
        working-directory: reviewer
        run: npm ci

      - name: Test reviewer application
        working-directory: reviewer
        run: npm run test:run

      - name: Build reviewer application
        working-directory: reviewer
        run: npm run build

  infrastructure:
    name: Terraform and container checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without remote state
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: infra/terraform
        run: terraform validate -no-color

      - name: Build production container
        run: docker build --platform linux/amd64 --tag "invoiceflow-ci:${GITHUB_SHA}" .
